[project]
name = "abdullah-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Abdallah AI – Interactive Voice Portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-frontmatter>=1.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
