[project]
name = "abdullah-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Abdallah AI – Interactive Voice Portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.0",
    "numpy>=2.2.0",
    "onnxruntime>=1.22.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.34",
    "rank-bm25>=0.2.2",
    "tokenizers>=0.22.0",
]

# Vercel: the FastAPI app and its build step (runs after dependencies are installed).
[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python -m app.deploy"

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.54.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
